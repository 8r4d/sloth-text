# Builds Sloth Writer for macOS, Windows and Linux and attaches the
# downloads to a GitHub release: a universal Mac app (Apple and Intel), a
# Windows installer and zip, and a Linux AppImage and .tar.gz. Tag a version to make one:
#
#   git tag writer-v1.44.0 && git push origin writer-v1.44.0
#
# Or run it by hand from the Actions tab: the downloads are then kept with
# that run (Artifacts) rather than released. See CROSS-PLATFORM.md, phase 2.
name: Release

on:
  push:
    tags: ["writer-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      # Each system's downloads on their own: one failing doesn't stop the rest.
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The Mac app is universal: built for both, then joined.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libfontconfig1-dev desktop-file-utils

      - name: Build
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo build --release --locked -p sloth-writer --target aarch64-apple-darwin
            cargo build --release --locked -p sloth-writer --target x86_64-apple-darwin
          else
            cargo build --release --locked -p sloth-writer
          fi

      - name: Package
        id: package
        run: |
          version=$(grep -m1 '^version' writer/Cargo.toml | cut -d'"' -f2)
          mkdir -p dist
          files=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            # A universal app: Apple silicon and Intel in one, signed for
            # running here (not by an Apple developer: open it the first
            # time with right-click, Open).
            app="dist/Sloth Writer.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            lipo -create -output "$app/Contents/MacOS/sloth-writer" \
              target/aarch64-apple-darwin/release/sloth-writer target/x86_64-apple-darwin/release/sloth-writer
            sed "s/VERSION/$version/g" writer/packaging/macos/Info.plist > "$app/Contents/Info.plist"
            cp writer/icons/SlothWriter.icns "$app/Contents/Resources/"
            codesign --force --deep -s - "$app"
            (cd dist && ditto -c -k --keepParent "Sloth Writer.app" "Sloth-Writer-$version-macos-universal.zip")
            files+=("dist/Sloth-Writer-$version-macos-universal.zip")
          elif [ "$RUNNER_OS" = "Windows" ]; then
            name="Sloth-Writer-$version-windows-x64"
            mkdir "dist/$name"
            cp target/release/sloth-writer.exe "dist/$name/Sloth Writer.exe"
            printf '%s\r\n' \
              "Sloth Writer $version for Windows" "" \
              "Unzip this folder anywhere (Documents, say) and open Sloth Writer.exe." \
              "Or use the installer (Sloth-Writer-$version-windows-setup.exe) instead." \
              "Windows may warn that it doesn't know the app (it isn't signed):" \
              "choose More info, then Run anyway. It asks only the first time." "" \
              "Settings and backups are kept in %LOCALAPPDATA%\\Sloth Writer." \
              > "dist/$name/Read Me.txt"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
            files+=("dist/$name.zip")
            # The installer (NSIS): for you alone, with a Start menu entry.
            # (Each place tried in turn: the step stops at any failed command.)
            find_nsis() {
              for p in "/c/Program Files (x86)/NSIS/makensis.exe" "/c/Program Files/NSIS/makensis.exe"; do
                if [ -x "$p" ]; then echo "$p"; return 0; fi
              done
              command -v makensis || true
            }
            makensis="$(find_nsis)"
            if [ -z "$makensis" ]; then
              # NSIS 3.10's own portable zip, from its home on SourceForge.
              curl -sfL --retry 5 --retry-all-errors -o nsis.zip "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10.zip" \
                && 7z x -y nsis.zip > /dev/null && makensis="$PWD/nsis-3.10/makensis.exe" || true
            fi
            if [ -z "$makensis" ]; then
              choco install nsis -y --no-progress || true
              makensis="$(find_nsis)"
            fi
            echo "NSIS: $makensis"
            setup="Sloth-Writer-$version-windows-setup.exe"
            "$makensis" -V2 -DVERSION="$version" -DEXE="$(cygpath -w "$PWD/target/release/sloth-writer.exe")" \
              -DOUT="$(cygpath -w "$PWD/dist/$setup")" writer/packaging/windows/installer.nsi
            files+=("dist/$setup")
          else
            name="sloth-writer-$version-linux-x64"
            mkdir "dist/$name"
            cp target/release/sloth-writer "dist/$name/"
            cp writer/icons/icon-512.png "dist/$name/sloth-writer.png"
            cp writer/packaging/linux/sloth-writer.desktop writer/packaging/linux/install.sh "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            files+=("dist/$name.tar.gz")
            # The AppImage: one file to make executable and run.
            appdir=dist/AppDir
            mkdir -p "$appdir/usr/bin"
            cp target/release/sloth-writer "$appdir/usr/bin/"
            cp writer/packaging/linux/sloth-writer.desktop "$appdir/"
            cp writer/icons/icon-512.png "$appdir/sloth-writer.png"
            printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/sloth-writer" "$@"\n' > "$appdir/AppRun"
            chmod +x "$appdir/AppRun"
            curl -sfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
            chmod +x appimagetool
            ARCH=x86_64 ./appimagetool --appimage-extract-and-run --no-appstream "$appdir" "dist/Sloth-Writer-$version-x86_64.AppImage"
            files+=("dist/Sloth-Writer-$version-x86_64.AppImage")
          fi
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.files }}
          name: Sloth Writer ${{ github.ref_name }}
          body: |
            **Mac:** Sloth-Writer-…-macos-universal.zip (Apple silicon and Intel). Unzip, move to Applications, and the first time right-click it and choose Open (it isn't signed by an Apple developer).
            **Windows:** Sloth-Writer-…-windows-setup.exe installs it for you (Start menu, uninstall in Settings → Apps), or unzip the .zip anywhere. Windows may warn it doesn't know the app: More info, then Run anyway.
            **Linux:** the .AppImage (make it executable and run it), or the .tar.gz with install.sh.
            What's new: writer/CHANGELOG.md.

      - name: Keep with the run
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.package.outputs.files }}
