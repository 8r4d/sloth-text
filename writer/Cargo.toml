[package]
name = "sloth-writer"
version = "1.36.0"
edition = "2024"
description = "Sloth Writer: a long-form writing app built on sloth-core"

[dependencies]
sloth-core = { path = "../core" }
eframe = { version = "0.37.0", features = ["persistence"] }
ron = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
rfd = "0.18.0"
docx-rs = "0.4.22"
pulldown-cmark = "0.13.6"
chrono = "0.4.45"
similar = "3.2.1"
ureq = { version = "3.5.2", features = ["json"] }
serde_json = "1.0.154"
encoding_rs = "0.8"
roxmltree = "0.21"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Same major version eframe uses; needed to turn off winit's default menu.
winit = "0.30"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu"] }

# scripts/install-writer.sh builds "Sloth Writer.app" (via cargo-bundle) and installs it
[package.metadata.bundle]
name = "Sloth Writer"
identifier = "com.bradsalomons.sloth-writer"
category = "public.app-category.productivity"
short_description = "A writing app for long projects"
copyright = "© 2026 Brad Salomons"
# Drawn by scripts/make-writer-icon.swift
icon = ["icons/SlothWriter.icns"]
