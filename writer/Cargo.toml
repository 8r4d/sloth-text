[package]
name = "sloth-writer"
version = "0.1.0"
edition = "2024"
description = "Sloth Writer (working name): a long-form writing app built on sloth-core"

[dependencies]
sloth-core = { path = "../core" }
eframe = { version = "0.37.0", features = ["persistence"] }
ron = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
rfd = "0.18.0"
docx-rs = "0.4.22"
pulldown-cmark = "0.13.6"
chrono = "0.4.45"
similar = "3.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Same major version eframe uses; needed to turn off winit's default menu.
winit = "0.30"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu"] }
